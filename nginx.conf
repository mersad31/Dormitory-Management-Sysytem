server {
    listen 80;
    listen [::]:80;

    server_name djangoapp.ir www.djangoapp.ir;
    return 302 https://$server_name$request_uri;
}



server {
   listen 443 ssl http2;
   listen [::]:443 ssl http2;
   ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;

   ssl on;
   ssl_certificate /etc/nginx/SSLCerts/djangoapp.ir/djangoapp.ir.pem;
   ssl_certificate_key /etc/nginx/SSLCerts/djangoapp.ir/djangoapp.ir.key;
   gzip on; gzip_vary on; gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;

    location /StaticFiles {
        autoindex on;
        alias /root/projects/Dormitory-ut/StaticFiles/;
    }

    location / {
        include proxy_params;
        client_max_body_size 100M;
        proxy_pass  http://172.17.0.4:15002;
    }
}


version: '3.9'

services:
  web:
#    build: .
    image: dorm_management_system_container_image:latest
    container_name: 'DormManagementSystem_container'
    command: gunicorn DormManagementSystem.wsgi:application runserver --workers 3 --bind 0.0.0.0:15002
    volumes:
      - ./db.sqlite3:/usr/src/App/db.sqlite3
      - ./StaticFiles/:/usr/src/App/StaticFiles/
    ports:
      - "127.0.0.1:15002:15002"
    network_mode: bridge
    restart: always
